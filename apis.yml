description: Oricell Therapeutics (原启生物) is a Shanghai-based clinical-stage biopharmaceutical
  company developing cell-based immunotherapies for cancer, including GPC3-targeted CAR-T (Ori-C101)
  for advanced liver cancer and GPRC5D-targeted CAR-T (OriCAR-017) for relapsed/refractory multiple
  myeloma. It operates proprietary OriAb antibody-discovery, OriCAR T-cell persistence, and cell-manufacturing
  (CMC) platforms. Backed by Qiming Venture Partners. As a clinical-stage biotech it publishes no public
  developer API, documentation, or technical developer surface; this profile is retained as a company
  record in the API Evangelist network.
